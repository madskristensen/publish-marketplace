name: "Publish to VS Marketplace"
description: "Publish a Visual Studio IDE extension (.vsix) to the Visual Studio Marketplace"

inputs:
  extension-file:
    description: "Path to the .vsix file to publish"
    required: true
  publish-manifest-file:
    description: "Path to the publishManifest.json file"
    required: true
  personal-access-code:
    description: "Personal Access Token with Marketplace (Acquire + Manage) permission"
    required: true

runs:
  using: "composite"
  steps:
    - name: Publish to VS Marketplace
      shell: python3 {0}
      env:
        VSIX_FILE: ${{ inputs.extension-file }}
        MANIFEST_FILE: ${{ inputs.publish-manifest-file }}
        TOKEN: ${{ inputs.personal-access-code }}
      run: |
        import os, sys, json, zipfile, base64, xml.etree.ElementTree as ET
        import urllib.request, urllib.error, urllib.parse, time

        vsix_file = os.environ["VSIX_FILE"]
        manifest_file = os.environ["MANIFEST_FILE"]
        token = os.environ["TOKEN"]

        if not os.path.isfile(vsix_file):
            print(f"::error::VSIX file not found: {vsix_file}", file=sys.stderr)
            sys.exit(1)

        if not os.path.isfile(manifest_file):
            print(f"::error::Manifest file not found: {manifest_file}", file=sys.stderr)
            sys.exit(1)

        # Read publisher/internalName from vs-publish.json for the URL
        with open(manifest_file) as f:
            manifest = json.load(f)
        publisher = manifest["publisher"]
        extension_id = manifest["identity"]["internalName"]

        # Read version from vsixmanifest for logging; upload VSIX unmodified.
        # api-version 4.1-preview.2 (matching VsixPublisher.exe) is more lenient
        # about publisher display name vs account ID mismatches in the manifest.
        ns = {"vs": "http://schemas.microsoft.com/developer/vsx-schema/2011"}
        with zipfile.ZipFile(vsix_file) as z:
            vsix_manifests = [n for n in z.namelist() if n.endswith(".vsixmanifest")]
            if not vsix_manifests:
                print("::error::No .vsixmanifest found in VSIX", file=sys.stderr)
                sys.exit(1)
            with z.open(vsix_manifests[0]) as f:
                root = ET.parse(f).getroot()
        version = root.find("vs:Metadata/vs:Identity", ns).get("Version")

        with open(vsix_file, "rb") as f:
            data = f.read()

        print(f"Publishing {publisher}.{extension_id} v{version}...")

        pub_enc = urllib.parse.quote(publisher, safe="")
        ext_enc = urllib.parse.quote(extension_id, safe="")
        update_url = (
            f"https://marketplace.visualstudio.com/_apis/gallery/publishers/{pub_enc}"
            f"/extensions/{ext_enc}?api-version=4.1-preview.2"
        )
        create_url = (
            f"https://marketplace.visualstudio.com/_apis/gallery/publishers/{pub_enc}"
            f"/extensions/?api-version=4.1-preview.2"
        )

        pat = base64.b64encode(f"OAuth:{token}".encode()).decode()

        def make_req(url, method):
            req = urllib.request.Request(url, data=data, method=method)
            req.add_header("Authorization", f"Basic {pat}")
            req.add_header("Content-Type", "application/octet-stream")
            req.add_header("Content-Length", str(len(data)))
            return req

        def send(url, method, label):
            for attempt in range(1, 4):
                try:
                    with urllib.request.urlopen(make_req(url, method)) as resp:
                        print(f"{label} {publisher}.{extension_id} v{version} successfully")
                        return None  # success
                except urllib.error.HTTPError as e:
                    if e.code >= 500 and attempt < 3:
                        print(f"Server error ({e.code}), retrying in 5s... ({attempt}/3)")
                        time.sleep(5)
                        continue
                    return e  # fatal or non-retryable
            return e

        err = send(update_url, "PUT", "Updated")
        if err is not None:
            if err.code == 404:
                err = send(create_url, "POST", "Created")
            if err is not None:
                body = err.read().decode("utf-8", errors="replace")
                print(f"::error::Publish failed ({err.code} {err.reason}): {body}", file=sys.stderr)
                sys.exit(1)