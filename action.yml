name: "Publish to VS Marketplace"
description: "Publish a Visual Studio IDE extension (.vsix) to the Visual Studio Marketplace"

inputs:
  extension-file:
    description: "Path to the .vsix file to publish"
    required: true
  publish-manifest-file:
    description: "Path to the publishManifest.json file (accepted for compatibility, not currently used)"
    required: false
  personal-access-code:
    description: "Personal Access Token with Marketplace (Acquire + Manage) permission"
    required: true

runs:
  using: "composite"
  steps:
    - name: Publish to VS Marketplace
      shell: python3 {0}
      env:
        VSIX_FILE: ${{ inputs.extension-file }}
        TOKEN: ${{ inputs.personal-access-code }}
      run: |
        import os, sys, zipfile, xml.etree.ElementTree as ET
        import urllib.request, urllib.error

        vsix_file = os.environ["VSIX_FILE"]
        token = os.environ["TOKEN"]

        if not os.path.isfile(vsix_file):
            print(f"::error::VSIX file not found: {vsix_file}", file=sys.stderr)
            sys.exit(1)

        with zipfile.ZipFile(vsix_file) as z:
            manifests = [n for n in z.namelist() if n.endswith(".vsixmanifest")]
            if not manifests:
                print("::error::No .vsixmanifest found in VSIX", file=sys.stderr)
                sys.exit(1)
            with z.open(manifests[0]) as f:
                root = ET.parse(f).getroot()

        ns = {"vs": "http://schemas.microsoft.com/developer/vsx-schema/2011"}
        identity = root.find("vs:Metadata/vs:Identity", ns)
        publisher = identity.get("Publisher")
        extension_id = identity.get("Id")
        version = identity.get("Version")

        print(f"Publishing {publisher}.{extension_id} v{version}...")

        with open(vsix_file, "rb") as f:
            data = f.read()

        url = (
            f"https://marketplace.visualstudio.com/_apis/gallery/publishers/{publisher}"
            f"/extensions/{extension_id}/{version}/vspackage?api-version=3.0-preview.1"
        )

        req = urllib.request.Request(url, data=data, method="PUT")
        req.add_header("Authorization", f"Bearer {token}")
        req.add_header("Content-Type", "application/octet-stream")
        req.add_header("Content-Length", str(len(data)))

        try:
            with urllib.request.urlopen(req) as resp:
                print(f"Published {publisher}.{extension_id} v{version} successfully")
        except urllib.error.HTTPError as e:
            body = e.read().decode("utf-8", errors="replace")
            print(f"::error::Publish failed ({e.code} {e.reason}): {body}", file=sys.stderr)
            sys.exit(1)