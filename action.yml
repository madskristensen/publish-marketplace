name: "Publish to VS Marketplace"
description: "Publish a Visual Studio IDE extension (.vsix) to the Visual Studio Marketplace"

inputs:
  extension-file:
    description: "Path to the .vsix file to publish"
    required: true
  publish-manifest-file:
    description: "Path to the publishManifest.json file"
    required: true
  personal-access-code:
    description: "Personal Access Token with Marketplace (Acquire + Manage) permission"
    required: true

runs:
  using: "composite"
  steps:
    - name: Publish to VS Marketplace
      shell: pwsh
      env:
        VSIX_FILE: ${{ inputs.extension-file }}
        MANIFEST_FILE: ${{ inputs.publish-manifest-file }}
        TOKEN: ${{ inputs.personal-access-code }}
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -products * -latest -requires Microsoft.Component.MSBuild -property installationPath
        $vsixPublisher = Join-Path $vsPath "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"
        if (-not (Test-Path $vsixPublisher)) { Write-Error "VsixPublisher.exe not found at $vsixPublisher"; exit 1 }

        & $vsixPublisher publish `
          -payload $env:VSIX_FILE `
          -publishManifest $env:MANIFEST_FILE `
          -personalAccessToken $env:TOKEN

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }