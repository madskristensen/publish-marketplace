name: "Publish to VS Marketplace"
description: "Publish a Visual Studio IDE extension (.vsix) to the Visual Studio Marketplace"

branding:
  icon: 'arrow-up-circle'
  color: 'purple'

inputs:
  extension-file:
    description: "Path to the .vsix file to publish"
    required: true
  publish-manifest-file:
    description: "Path to the publishManifest.json file"
    required: true
  personal-access-code:
    description: "Personal Access Token with Marketplace (Acquire + Manage) permission"
    required: false
  oidc:
    description: "Use GitHub OIDC trusted publishing; requires job permission id-token: write"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Publish to VS Marketplace
      shell: pwsh
      env:
        VSIX_FILE: ${{ inputs.extension-file }}
        MANIFEST_FILE: ${{ inputs.publish-manifest-file }}
        TOKEN: ${{ inputs.personal-access-code }}
        USE_OIDC: ${{ inputs.oidc }}
      run: |
        $ErrorActionPreference = 'Stop'

        # Defensive masking: if the caller accidentally passed a literal value
        # instead of a secret, this still keeps the token out of the logs.
        if ($env:TOKEN) { Write-Host "::add-mask::$env:TOKEN" }

        # Validate inputs up front so users get a clear error instead of a
        # cryptic VsixPublisher.exe failure 100 lines deep.
        if (-not (Test-Path -LiteralPath $env:VSIX_FILE -PathType Leaf)) {
          Write-Host "::error::extension-file not found: $env:VSIX_FILE"
          exit 1
        }
        if (-not (Test-Path -LiteralPath $env:MANIFEST_FILE -PathType Leaf)) {
          Write-Host "::error::publish-manifest-file not found: $env:MANIFEST_FILE"
          exit 1
        }

        # Validate that either a PAT or OIDC is provided
        $useOidc = ($env:USE_OIDC -eq 'true')
        if (-not $env:TOKEN -and -not $useOidc) {
          Write-Host "::error::Either personal-access-code or oidc must be provided"
          exit 1
        }
        if ($env:TOKEN -and $useOidc) {
          Write-Host "::error::Cannot use both personal-access-code and oidc. Use one or the other."
          exit 1
        }
        if ($useOidc -and (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
          Write-Host "::error::OIDC requires GitHub Actions with permissions: id-token: write on the publishing job."
          exit 1
        }

        $vsixFull = (Resolve-Path -LiteralPath $env:VSIX_FILE).Path
        $manifestFull = (Resolve-Path -LiteralPath $env:MANIFEST_FILE).Path

        # Always grab the latest Microsoft.VSSDK.BuildTools from NuGet. This
        # keeps VsixPublisher.exe current with whatever Marketplace expects.
        # Pinning the action does not pin the downloaded tool version.
        Write-Host "::group::Download VsixPublisher.exe (latest Microsoft.VSSDK.BuildTools)"
        $nugetUrl = "https://www.nuget.org/api/v2/package/Microsoft.VSSDK.BuildTools"
        $zip = Join-Path $env:RUNNER_TEMP "vssdk.zip"
        $toolDir = Join-Path $env:RUNNER_TEMP "vssdk"
        try {
          Invoke-WebRequest -Uri $nugetUrl -OutFile $zip -UseBasicParsing
          if (Test-Path -LiteralPath $toolDir) { Remove-Item -LiteralPath $toolDir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $toolDir -Force
        }
        catch {
          Write-Host "::endgroup::"
          Write-Host "::error::Failed to download Microsoft.VSSDK.BuildTools: $($_.Exception.Message)"
          exit 1
        }
        $vsixPublisher = Get-ChildItem -Path $toolDir -Filter "VsixPublisher.exe" -Recurse |
          Select-Object -First 1 -ExpandProperty FullName
        Write-Host "::endgroup::"
        if (-not $vsixPublisher) {
          Write-Host "::error::VsixPublisher.exe not found in Microsoft.VSSDK.BuildTools package"
          exit 1
        }
        # BuildTools can bundle a newer MSAL than the publisher references.
        $msalPath = Join-Path (Split-Path $vsixPublisher -Parent) 'lib\Microsoft.Identity.Client.dll'
        if (Test-Path -LiteralPath $msalPath) {
          $msalVersion = [System.Reflection.AssemblyName]::GetAssemblyName($msalPath).Version.ToString()
          $configPath = "$vsixPublisher.config"
          $config = [xml](Get-Content -LiteralPath $configPath -Raw)
          $namespace = 'urn:schemas-microsoft-com:asm.v1'
          $namespaces = [System.Xml.XmlNamespaceManager]::new($config.NameTable)
          $namespaces.AddNamespace('asm', $namespace)
          $binding = $config.SelectSingleNode('/configuration/runtime/asm:assemblyBinding', $namespaces)
          $dependency = $config.SelectSingleNode("/configuration/runtime/asm:assemblyBinding/asm:dependentAssembly[asm:assemblyIdentity/@name='Microsoft.Identity.Client']", $namespaces)
          if (-not $dependency) {
            $dependency = $config.CreateElement('dependentAssembly', $namespace)
            $identity = $config.CreateElement('assemblyIdentity', $namespace)
            $identity.SetAttribute('name', 'Microsoft.Identity.Client')
            $identity.SetAttribute('publicKeyToken', '0a613f4dd989e8ae')
            $identity.SetAttribute('culture', 'neutral')
            [void]$dependency.AppendChild($identity)
            [void]$binding.AppendChild($dependency)
          }
          $redirect = $dependency.SelectSingleNode('asm:bindingRedirect', $namespaces)
          if (-not $redirect) {
            $redirect = $config.CreateElement('bindingRedirect', $namespace)
            [void]$dependency.AppendChild($redirect)
          }
          $redirect.SetAttribute('oldVersion', "0.0.0.0-$msalVersion")
          $redirect.SetAttribute('newVersion', $msalVersion)
          $config.Save($configPath)
          Write-Host "Configured Microsoft.Identity.Client binding redirect to $msalVersion"
        }

        # Resolve the Marketplace itemName from publishManifest.json. The
        # publisher ID and the extension's internal name are what compose
        # the Marketplace URL ({publisher}.{internalName}). The vsixmanifest
        # Publisher attribute is a *display name* (e.g. "Mads Kristensen")
        # and its Identity Id may include a GUID suffix on newer extensions
        # -- neither belongs in the URL.
        $publisher = $null
        $internalName = $null
        $version = $null
        $displayName = $null
        try {
          $manifestJson = Get-Content -LiteralPath $manifestFull -Raw | ConvertFrom-Json
          $publisher = $manifestJson.publisher
          if ($manifestJson.identity) { $internalName = $manifestJson.identity.internalName }
        } catch {
          if ($useOidc) {
            Write-Host "::error::Could not parse publishManifest.json for trusted publishing."
            exit 1
          }
          Write-Host "::warning::Could not parse publishManifest.json: $($_.Exception.Message)"
        }

        # Pull display name and version from the VSIX (and use the manifest
        # Id as a fallback for internalName when the publish manifest omits
        # it -- VsixPublisher itself falls back the same way).
        try {
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($vsixFull)
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -eq 'extension.vsixmanifest' } | Select-Object -First 1
            if ($entry) {
              $reader = New-Object System.IO.StreamReader($entry.Open())
              try { $manifestXml = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
              $identity = $manifestXml.PackageManifest.Metadata.Identity
              $version = $identity.Version
              $displayName = $manifestXml.PackageManifest.Metadata.DisplayName
              if ($displayName -is [System.Xml.XmlElement]) { $displayName = $displayName.InnerText }
              if (-not $internalName) { $internalName = $identity.Id }
            }
          } finally { $archive.Dispose() }
        } catch {
          Write-Host "::warning::Could not parse extension.vsixmanifest from VSIX: $($_.Exception.Message)"
        }

        $publishToken = $env:TOKEN
        if ($useOidc) {
          if ($publisher -isnot [string] -or [string]::IsNullOrWhiteSpace($publisher)) {
            Write-Host "::error::Trusted publishing requires a publisher identifier in publishManifest.json."
            exit 1
          }

          try {
            $oidcUri = [System.UriBuilder]::new($env:ACTIONS_ID_TOKEN_REQUEST_URL)
            $query = @($oidcUri.Query.TrimStart('?') -split '&' | Where-Object { $_ -and $_ -notmatch '^audience=' })
            $oidcUri.Query = ($query + 'audience=marketplace.visualstudio.com') -join '&'
            $oidc = Invoke-RestMethod -Method Get -Uri $oidcUri.Uri.AbsoluteUri -Headers @{
              Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
              Accept = 'application/json'
            }
          } catch {
            Write-Host "::error::Failed to request a GitHub OIDC token. Verify id-token: write permission."
            exit 1
          }
          if ($oidc.value -isnot [string] -or [string]::IsNullOrWhiteSpace($oidc.value)) {
            Write-Host "::error::GitHub OIDC token request returned no valid token."
            exit 1
          }
          Write-Host "::add-mask::$($oidc.value)"

          # VsixPublisher's native -oidc exchange omits the required API version.
          try {
            $exchange = Invoke-RestMethod -Method Post -Uri 'https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1' -Headers @{
              Authorization = "FederatedToken $($oidc.value)"
              Accept = 'application/json'
              'X-Market-CI-Provider' = 'github-actions'
            } -ContentType 'application/json' -Body (@{ publisherName = $publisher } | ConvertTo-Json -Compress)
          } catch {
            Write-Host "::error::Marketplace OIDC token exchange failed. Verify the trusted publishing policy and publisher identifier."
            exit 1
          }
          if ($exchange.credential -isnot [string] -or [string]::IsNullOrWhiteSpace($exchange.credential)) {
            Write-Host "::error::Marketplace OIDC token exchange returned no valid credential."
            exit 1
          }
          $publishToken = $exchange.credential
          Write-Host "::add-mask::$publishToken"
        }

        Write-Host "::group::VsixPublisher publish"
        $publishArgs = @(
          "publish",
          "-payload", $vsixFull,
          "-publishManifest", $manifestFull,
          "-personalAccessToken", $publishToken
        )

        & $vsixPublisher $publishArgs
        $publishExit = $LASTEXITCODE
        Write-Host "::endgroup::"

        if ($publishExit -ne 0) {
          Write-Host "::error::VsixPublisher.exe exited with code $publishExit"
          exit $publishExit
        }

        # Build a step summary with a link to the listing. Best-effort: a
        # summary failure must never fail the step.
        try {
          if ($env:GITHUB_STEP_SUMMARY -and $publisher -and $internalName) {
            $itemName = "$publisher.$internalName"
            $marketplaceUrl = "https://marketplace.visualstudio.com/items?itemName=$itemName"
            $heading = if ($displayName) { $displayName } else { $itemName }

            $sb = [System.Text.StringBuilder]::new()
            [void]$sb.AppendLine("## Published to Visual Studio Marketplace")
            [void]$sb.AppendLine()
            [void]$sb.AppendLine("**$heading**$(if ($version) { " " + $version })")
            [void]$sb.AppendLine()
            [void]$sb.AppendLine("[View on Marketplace]($marketplaceUrl)")
            [void]$sb.AppendLine()
            [void]$sb.AppendLine("<details><summary>Expand for details</summary>")
            [void]$sb.AppendLine()
            [void]$sb.AppendLine("- **Item name:** ``$itemName``")
            if ($version) { [void]$sb.AppendLine("- **Version:** ``$version``") }
            [void]$sb.AppendLine("- **Marketplace URL:** $marketplaceUrl")
            [void]$sb.AppendLine()
            [void]$sb.AppendLine("</details>")

            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $sb.ToString(), [System.Text.UTF8Encoding]::new($false))

            Write-Host ""
            Write-Host "Published $heading$(if ($version) { ' ' + $version })"
            Write-Host "  Marketplace: $marketplaceUrl"
          }
        } catch {
          Write-Host "::warning::Failed to write step summary: $($_.Exception.Message)"
        }