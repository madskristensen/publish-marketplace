name: "Publish to VS Marketplace"
description: "Publish a Visual Studio IDE extension (.vsix) to the Visual Studio Marketplace"

inputs:
  extension-file:
    description: "Path to the .vsix file to publish"
    required: true
  publish-manifest-file:
    description: "Path to the publishManifest.json file"
    required: true
  personal-access-code:
    description: "Personal Access Token with Marketplace (Acquire + Manage) permission"
    required: true

runs:
  using: "composite"
  steps:
    - name: Publish to VS Marketplace
      shell: python3 {0}
      env:
        VSIX_FILE: ${{ inputs.extension-file }}
        MANIFEST_FILE: ${{ inputs.publish-manifest-file }}
        TOKEN: ${{ inputs.personal-access-code }}
      run: |
        import os, sys, io, re, json, zipfile, base64, xml.etree.ElementTree as ET
        import urllib.request, urllib.error, urllib.parse

        vsix_file = os.environ["VSIX_FILE"]
        manifest_file = os.environ["MANIFEST_FILE"]
        token = os.environ["TOKEN"]

        if not os.path.isfile(vsix_file):
            print(f"::error::VSIX file not found: {vsix_file}", file=sys.stderr)
            sys.exit(1)

        if not os.path.isfile(manifest_file):
            print(f"::error::Manifest file not found: {manifest_file}", file=sys.stderr)
            sys.exit(1)

        # Publisher and internalName come from vs-publish.json
        with open(manifest_file) as f:
            manifest = json.load(f)
        publisher = manifest["publisher"]
        extension_id = manifest["identity"]["internalName"]

        # Read the VSIX, patch Publisher and Id in the vsixmanifest so they
        # match the marketplace publisher account ID and internalName exactly.
        ns = {"vs": "http://schemas.microsoft.com/developer/vsx-schema/2011"}
        buf = io.BytesIO()
        version = None
        with zipfile.ZipFile(vsix_file) as z_in:
            vsix_manifests = [n for n in z_in.namelist() if n.endswith(".vsixmanifest")]
            if not vsix_manifests:
                print("::error::No .vsixmanifest found in VSIX", file=sys.stderr)
                sys.exit(1)
            with zipfile.ZipFile(buf, "w", compression=zipfile.ZIP_DEFLATED) as z_out:
                for item in z_in.infolist():
                    raw = z_in.read(item.filename)
                    if item.filename.endswith(".vsixmanifest"):
                        text = raw.decode("utf-8")
                        root = ET.fromstring(text)
                        identity = root.find("vs:Metadata/vs:Identity", ns)
                        version = identity.get("Version")
                        text = re.sub(r'(?<=\bPublisher=")[^"]*(?=")', publisher, text)
                        text = re.sub(r'(?<=\bId=")[^"]*(?=")', extension_id, text)
                        raw = text.encode("utf-8")
                    z_out.writestr(item, raw)
        data = buf.getvalue()

        print(f"Publishing {publisher}.{extension_id} v{version}...")

        pub_enc = urllib.parse.quote(publisher, safe="")
        ext_enc = urllib.parse.quote(extension_id, safe="")
        update_url = (
            f"https://marketplace.visualstudio.com/_apis/gallery/publishers/{pub_enc}"
            f"/extensions/{ext_enc}?api-version=4.1-preview.2"
        )
        create_url = (
            f"https://marketplace.visualstudio.com/_apis/gallery/publishers/{pub_enc}"
            f"/extensions/?api-version=4.1-preview.2"
        )

        pat = base64.b64encode(f"OAuth:{token}".encode()).decode()

        def make_req(url, method):
            req = urllib.request.Request(url, data=data, method=method)
            req.add_header("Authorization", f"Basic {pat}")
            req.add_header("Content-Type", "application/octet-stream")
            req.add_header("Content-Length", str(len(data)))
            return req

        try:
            with urllib.request.urlopen(make_req(update_url, "PUT")) as resp:
                print(f"Updated {publisher}.{extension_id} v{version} successfully")
        except urllib.error.HTTPError as e:
            if e.code == 404:
                # Extension doesn't exist yet — create it
                try:
                    with urllib.request.urlopen(make_req(create_url, "POST")) as resp:
                        print(f"Created {publisher}.{extension_id} v{version} successfully")
                except urllib.error.HTTPError as e2:
                    body = e2.read().decode("utf-8", errors="replace")
                    print(f"::error::Publish failed ({e2.code} {e2.reason}): {body}", file=sys.stderr)
                    sys.exit(1)
            else:
                body = e.read().decode("utf-8", errors="replace")
                print(f"::error::Publish failed ({e.code} {e.reason}): {body}", file=sys.stderr)
                sys.exit(1)